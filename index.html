<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Kelas 4 - SDN Ranuklindungan I</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-amber-50 min-h-screen text-slate-800 pb-12 font-sans">

  <header class="bg-gradient-to-r from-teal-400 to-blue-500 p-6 shadow-md text-center rounded-b-3xl">
    <h1 class="text-2xl md:text-3xl font-extrabold text-white drop-shadow-sm">🎒 ABSENSI MURID KELAS 4</h1>
    <p class="text-sm md:text-base text-white opacity-90 font-medium mt-1">SDN RANUKLINDUNGAN I</p>
    <div class="inline-block mt-2 px-4 py-1 bg-white/20 backdrop-blur-sm rounded-full text-white text-xs font-bold tracking-wide border border-white/20">
      📅 Tahun Ajaran: <span id="lblTahunAktifSiswa">⏳ Memuat...</span>
    </div>
  </header>

  <main class="max-w-md mx-auto mt-6 px-4">
    <div class="bg-white p-6 rounded-3xl shadow-xl border-4 border-teal-200">
      
      <div class="mb-5">
        <label for="inputAbsen" class="block text-base font-bold text-teal-800 mb-2">🔢 Masukkan Nomor Absen Kamu:</label>
        <input type="number" id="inputAbsen" 
               class="w-full px-4 py-3 rounded-2xl border-3 border-teal-300 font-extrabold text-2xl text-center focus:outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-200 transition-all placeholder-slate-300" 
               placeholder="Contoh: 12" min="1" disabled> </div>

      <div id="infoMurid" class="hidden p-4 rounded-2xl border-2 border-dashed mb-5 transition-all">
        <p id="infoMuridLabel" class="text-xs font-bold uppercase tracking-wider mb-1">Identitas Siswa:</p>
        <h3 id="namaSiswa" class="text-xl font-black">-</h3>
        <p id="alamatSiswa" class="text-sm mt-1 font-medium">-</p>
      </div>

      <div class="mb-6">
        <label class="block text-base font-bold text-teal-800 mb-2">📝 Pilih Keterangan:</label>
        <div class="grid grid-cols-2 gap-4">
          <label class="flex items-center justify-center p-4 border-2 border-slate-200 rounded-2xl cursor-pointer hover:bg-amber-50 font-bold text-lg bg-white shadow-sm transition-all select-none">
            <input type="radio" name="status" value="Sakit" class="mr-3 w-5 h-5 accent-teal-600"> <span>🤒 Sakit</span>
          </label>
          <label class="flex items-center justify-center p-4 border-2 border-slate-200 rounded-2xl cursor-pointer hover:bg-amber-50 font-bold text-lg bg-white shadow-sm transition-all select-none">
            <input type="radio" name="status" value="Izin" class="mr-3 w-5 h-5 accent-teal-600"> <span>✉️ Izin</span>
          </label>
        </div>
      </div>

      <div class="mb-6">
        <label class="block text-base font-bold text-teal-800 mb-2">📸 Ambil Foto Bukti (Klik Ikon):</label>
        
        <div class="w-full h-56 bg-slate-100 rounded-2xl border-2 border-dashed border-slate-300 flex items-center justify-center overflow-hidden mb-3 relative shadow-inner">
          <video id="video" class="w-full h-full object-cover hidden" autoplay playsinline></video>
          <canvas id="canvas" class="w-full h-full object-cover hidden"></canvas>
          <div id="placeholderImg" class="text-slate-400 font-medium text-sm flex flex-col items-center gap-2">
            <span>📷 Kamera belum aktif</span>
          </div>
        </div>

        <div class="text-center">
          <button type="button" id="btnCamera" class="bg-teal-500 text-white font-bold px-5 py-2.5 rounded-full hover:bg-teal-600 active:scale-95 shadow-md inline-flex items-center gap-2 transition-all cursor-pointer">
            Buka & Ambil Foto
          </button>
        </div>
      </div>

      <button type="button" id="btnKirim" disabled 
              class="w-full py-3.5 bg-slate-200 text-slate-400 font-black text-xl rounded-2xl shadow-inner cursor-not-allowed transition-all uppercase tracking-wide">
        Kirim Data Absen
      </button>

    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
